name: Java CI with Maven and Docker

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: world

        ports:
          - 33060:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Import world database
        run: |
          mysql \
            --host=127.0.0.1 \
            --port=33060 \
            --user=root \
            --password=password \
            world < world-db/world.sql

      - name: Build and test with Maven
        run: mvn clean package

      - name: Build Docker image
        run: docker build -t world-report .